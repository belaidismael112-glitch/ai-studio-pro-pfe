services:
  redis:
    image: redis:7-alpine
    container_name: ai_studio_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_studio_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      FRONTEND_PUBLIC_URL: http://localhost:3000
      BACKEND_PUBLIC_URL: http://127.0.0.1:8000
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://127.0.0.1:8000
      CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      COMFY_URL: http://host.docker.internal:8188
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATABASE_URL: sqlite:///./ai_studio.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_static:/app/static
      - backend_tmp:/app/tmp
    depends_on:
      - redis
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  webapp:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: ai_studio_webapp
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./webapp:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev -- -H 0.0.0.0 -p 3000

volumes:
  redis_data:
  backend_static:
  backend_tmp:
